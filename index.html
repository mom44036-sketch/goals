<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماذا تريد أن تحقق؟ | Ayed Academy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #FFFFFF;
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 12px;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  body.modal-open { overflow: hidden; }

  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px) rotate(var(--rot)); }
    to   { opacity: 1; transform: translateY(0) rotate(var(--rot)); }
  }
  @keyframes sway {
    0%   { transform: rotate(var(--rot)); }
    25%  { transform: rotate(calc(var(--rot) + 1.6deg)); }
    50%  { transform: rotate(var(--rot)); }
    75%  { transform: rotate(calc(var(--rot) - 1.6deg)); }
    100% { transform: rotate(var(--rot)); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(16px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes checkPop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes pulseDot {
    50% { opacity: .5; }
  }
  /* NEW: professional float only Y */
  @keyframes dartFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
  }
  @keyframes textureShift {
    0% { transform: translate(0,0); }
    100% { transform: translate(-20px,-20px); }
  }

  /* ===== hero section ===== */
  .hero-section {
    position: relative;
    width: 100%;
    max-width: 1240px;
    overflow: visible;
    background: #FFFFFF;
  }

  .hero-inner { position: relative; z-index: 10; padding: 48px 24px 40px; background: #FFFFFF; }
  @media (min-width: 768px) { .hero-inner { padding: 64px 32px 56px; } }
  @media (min-width: 1024px) { .hero-inner { padding-left: 64px; padding-right: 64px; } }

  .hero-header { text-align: center; max-width: 48rem; margin: 0 auto 40px; }
  @media (min-width: 768px) { .hero-header { margin-bottom: 56px; } }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 9999px;
    background: #EAF2FA; border: 1px solid #D3E4F5;
    color: #0D2F56; font-size: 13px; font-weight: 700; letter-spacing: .025em;
    margin-bottom: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);

  .badge-dot {

    animation: pulseDot 2s cubic-bezier(.4,0,.6,1) infinite;
  }
  .badge svg { width: 14px; height: 14px; color: #1A5399; }

  .hero-title {
    font-size: 30px; font-weight: 900; line-height: 1.15; letter-spacing: -0.025em; color: #1A1A1A; margin: 0;
  }
  @media (min-width: 768px) { .hero-title { font-size: 44px; } }
  .title-highlight { position: relative; display: inline-block; margin: 0 8px; }
  .title-highlight-text { position: relative; z-index: 10; color: #0D2F56; }
  .title-highlight-underline {
    position: absolute; bottom: 6px; left: 0; right: 0; height: 10px;
    background: rgba(255,210,122,.6); border-radius: 2px; transform: rotate(-1deg); z-index: 0;

  .hero-subtitle {
    margin-top: 16px; font-size: 15px; color: #5A6D86; font-weight: 500; line-height: 1.625;
  }
  @media (min-width: 768px) { .hero-subtitle { font-size: 17px; } }

  /* ===== cards grid ===== */
  .cards-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
  @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 28px; } }

  .goal-card {
    position: relative;
    border-radius: 22px;
    border: 1px solid;
    padding: 22px;
    cursor: pointer;
    transform: rotate(var(--rot));
    transition: transform .42s cubic-bezier(.16,1,.3,1), box-shadow .42s cubic-bezier(.16,1,.3,1), border-color .3s;
    opacity: 0;
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards, sway 6.5s ease-in-out infinite;
    animation-delay: var(--delay), var(--float-delay);
  }
  @media (min-width: 768px) { .goal-card { padding: 26px; } }
  @media (max-width: 767px) {
    .goal-card { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; }

  .goal-card:hover {
    z-index: 10;
    transform: rotate(0deg) translateY(-6px);
    border-color: rgba(255,181,38,.6);
    box-shadow: 0 20px 40px -12px rgba(13,47,86,.18), 0 8px 24px -8px rgba(13,47,86,.08);
    animation-play-state: paused;
  }

  .card-pin { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 20; }
  .card-pin-clip {
    width: 42px; height: 14px; border-radius: 8px;
    background: linear-gradient(to bottom, #E8E9EB, #C9CDD2, #A8ADB4);

    content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: rgba(0,0,0,.1);

  .card-text { flex: 1; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 800; color: #1A1A1A; line-height: 1.375; margin: 0; }
  @media (min-width: 768px) { .card-title { font-size: 18px; } }

  .card-desc-dot { width: 4px; height: 4px; border-radius: 9999px; background: #FFB526; flex-shrink: 0; }

  .card-icon {

    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(13,47,86,.12), inset 0 1px 0 rgba(255,255,255,.4);

  .card-icon svg { width: 22px; height: 22px; stroke-width: 1.9; }

  .card-footer { margin-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: rgba(13,47,86,.7); transition: color .15s; }

  .not-sure-circle {

  .not-sure-circle svg { width: 16px; height: 16px; }

  .footer-divider { margin-top: 40px; padding-top: 24px; border-top: 1px solid #EEF2F7; display: flex; justify-content: center; }
  .footer-divider p {
    font-size: 11px; font-weight: 500; letter-spacing: .1em; color: #9AA9BC; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; margin: 0;
  }
  .footer-divider .line { width: 32px; height: 1px; background: #DCE6F2; }

  .credit { margin-top: 32px; font-size: 11px; color: #9AA9BC; font-weight: 500; }

  /* ===== modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    align-items: flex-end; justify-content: center; padding: 0;
  }
  @media (min-width: 768px) { .modal-overlay { align-items: center; padding: 24px; } }

  .modal-backdrop {

  .modal-box {
    position: relative; width: 100%; background: #fff; overflow: visible;
    border-radius: 28px 28px 0 0;
    box-shadow: 0 24px 80px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.2);

  }
  @media (min-width: 768px) { .modal-box { max-width: 680px; border-radius: 28px; max-height: 86vh; } }

  /* ===== NEW PROFESSIONAL HEADER ===== */
  .modal-header {
    position: relative;
    background: linear-gradient(120deg, #EAF6FF 0%, #D7EBFF 45%, #C2DDFF 100%);
    padding: 26px 24px 22px;

  }
  @media (min-width: 768px) { .modal-header { padding: 30px 28px 26px; } }

  /* baby blue texture with success icons */
  .modal-header-pattern {
    position: absolute;
    inset: -20px;
    opacity: 0.09;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230D2F56' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3C!-- star --%3E%3Cg transform='translate(40 40)'%3E%3Cpath d='M12 2 L14.8 8.8 L22 9.3 L16.5 14 L18 21 L12 17.5 L6 21 L7.5 14 L2 9.3 L9.2 8.8 Z'/%3E%3C/g%3E%3C!-- trophy --%3E%3Cg transform='translate(150 35)'%3E%3Cpath d='M6 2 H18 V8 C18 12 15 15 12 15 C9 15 6 12 6 8 V2 Z'/%3E%3Cpath d='M6 4 H3 C2 4 1 5 1 7 C1 9 2 10 4 10'/%3E%3Cpath d='M18 4 H21 C22 4 23 5 23 7 C23 9 22 10 20 10'/%3E%3Cpath d='M12 15 V18'/%3E%3Cpath d='M8 18 H16'/%3E%3C/g%3E%3C!-- target --%3E%3Cg transform='translate(240 38)'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='5'/%3E%3Ccircle cx='12' cy='12' r='1.5' fill='%230D2F56' stroke='none'/%3E%3C/g%3E%3C!-- graduation cap --%3E%3Cg transform='translate(35 150)'%3E%3Cpath d='M12 4 L2 9 L12 14 L22 9 Z'/%3E%3Cpath d='M6 11 V15 C6 15 10 18 12 18 C14 18 18 15 18 15 V11'/%3E%3C/g%3E%3C!-- award --%3E%3Cg transform='translate(145 148)'%3E%3Ccircle cx='12' cy='8' r='6'/%3E%3Cpath d='M9 14 L7 22 L12 19 L17 22 L15 14'/%3E%3C/g%3E%3C!-- check badge --%3E%3Cg transform='translate(235 150)'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M8 12 L11 15 L16 9'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size: 300px 300px;
  }
  .modal-header-dots {
    position: absolute; inset: 0;
    opacity: 0.14;
    background-image: radial-gradient(rgba(13,47,86,0.22) 1.2px, transparent 1.2px);
    background-size: 20px 20px;
    pointer-events: none;
  }
  .modal-header-glow {
    position: absolute;
    top: -60px; right: -40px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .modal-header-blob-1 {
    position: absolute;
    bottom: -50px; left: -30px;
    width: 180px; height: 180px;
    background: rgba(59,130,246,0.10);
    border-radius: 9999px;
    filter: blur(24px);
    pointer-events: none;
  }
  .modal-header-blob-2 {
    position: absolute;
    top: -30px; left: 40%;
    width: 140px; height: 140px;
    background: rgba(255,181,38,0.12);
    border-radius: 9999px;
    filter: blur(20px);
    pointer-events: none;
  }

  .modal-close {
    position: absolute; top: 16px; left: 16px; width: 32px; height: 32px; border-radius: 9999px;
    background: rgba(13,47,86,0.06); border: 1px solid rgba(13,47,86,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #0D2F56; backdrop-filter: blur(8px); transition: all .15s;
    z-index: 5;
  }
  @media (min-width: 768px) { .modal-close { top: 18px; left: 18px; } }
  .modal-close:hover { background: rgba(13,47,86,0.1); color: #0D2F56; }
  .modal-close svg { width: 16px; height: 16px; }

  .modal-header-content { position: relative; display: flex; align-items: center; gap: 18px; z-index: 2; }
  @media (min-width: 768px) { .modal-header-content { gap: 20px; } }

  /* 3D book - no border, float only Y */
  .modal-header-dart {
    width: 82px; height: 82px; flex-shrink: 0;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 16px 22px rgba(13,47,86,0.22)) drop-shadow(0 6px 10px rgba(13,47,86,0.16));
    animation: dartFloat 5.2s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    will-change: transform;
  }
  @media (min-width: 768px) { .modal-header-dart { width: 92px; height: 92px; } }
  .modal-header-dart img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    background: transparent;
  }

  .modal-header-text { flex: 1; min-width: 0; padding-left: 6px; }
  .modal-header-title { font-size: 19px; font-weight: 900; line-height: 1.3; margin: 0; color: #0D2F56; letter-spacing: -0.01em; }
  @media (min-width: 768px) { .modal-header-title { font-size: 21px; } }
  .modal-header-subtitle { margin-top: 6px; font-size: 13.5px; font-weight: 500; color: #4A6B8A; line-height: 1.6; max-width: 92%; }
  @media (min-width: 768px) { .modal-header-subtitle { font-size: 13.8px; } }

  .modal-header-badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 10px;
    padding: 4px 10px;
    border-radius: 9999px;

<script>
(function () {
  const ICONS = {
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    award: '<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
    lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    bookopen: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
    compass: '<path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/>',
    heartpulse: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
    smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
    languages: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
    graduationcap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
    trendingup: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    arrowleft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    arrowupright: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    check: '<path d="M20 6 9 17l-5-5"/>'
  };
  function svg(iconKey) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[iconKey] + '</svg>';
  }
  const GOALS = [
    { title: 'أريد اجتياز STEP', desc: 'مسار مخصص + متابعة يومية', icon: 'target', bg: '#F7F3FF', border: '#E7DCFA', iconBg: '#8B5CF6', iconColor: '#FFFFFF', titleColor: '#5B21B6', rotate: '1deg' },
    { title: 'أريد رفع درجة IELTS', desc: 'خطة احترافية + محاكاة اختبار', icon: 'award', bg: '#FFF4EC', border: '#FBDFC7', iconBg: '#FF8A3D', iconColor: '#FFFFFF', titleColor: '#B45309', rotate: '-1.2deg' },
    { title: 'أريد اجتياز القدرات', desc: 'شرح مبسط + تدريبات ذكية', icon: 'lightbulb', bg: '#FFFBEA', border: '#FBEEB8', iconBg: '#F2C94C', iconColor: '#5A4300', titleColor: '#8A6A00', rotate: '0.8deg' },
    { title: 'أريد الاستعداد للتحصيلي', desc: 'ملخصات مركزة + بنك أسئلة', icon: 'bookopen', bg: '#EFF7FF', border: '#D6EAFB', iconBg: '#3AA0F0', iconColor: '#FFFFFF', titleColor: '#1D6FB8', rotate: '-0.9deg' },
    { title: 'أريد تطوير الإنجليزية', desc: 'من الصفر حتى الاحتراف', icon: 'globe', bg: '#F0FBF4', border: '#D4F1DD', iconBg: '#34B364', iconColor: '#FFFFFF', titleColor: '#1E7A46', rotate: '1.1deg' },
    { title: 'أريد تطوير مهاراتي المهنية', desc: 'شهادات معتمدة + مشاريع عملية', icon: 'briefcase', bg: '#FFF1F7', border: '#FBD9E8', iconBg: '#E8479A', iconColor: '#FFFFFF', titleColor: '#B02472', rotate: '-1deg' }
  ];
  const CATEGORIES = [
    { id: 'eng', label: 'الدورات الهندسية', icon: 'compass', hint: 'AutoCAD, PMP, Revit' },
    { id: 'med', label: 'الدورات الطبية', icon: 'heartpulse', hint: 'BLS, مصطلحات، تمريض' },
    { id: 'kids', label: 'دورات الأطفال والناشئين', icon: 'smile', hint: 'برمجة، إنجليزي، قدرات' },
    { id: 'lang', label: 'دورات اللغة والاختبارات الدولية', icon: 'languages', hint: 'IELTS, STEP, TOEFL' },
    { id: 'qudrat', label: 'دورات القدرات والتحصيلي', icon: 'graduationcap', hint: 'لفظي، كمي، علمي' },
    { id: 'pro', label: 'دورات التطوير المهني', icon: 'trendingup', hint: 'إدارة، تسويق، حاسب' }
  ];
  const cardsGrid = document.getElementById('cardsGrid');
  GOALS.forEach(function (g, i) {
    const card = document.createElement('div');
    card.className = 'goal-card';
    card.style.setProperty('--rot', g.rotate);
    card.style.setProperty('--delay', (i * 90) + 'ms');
    card.style.setProperty('--float-delay', (0.5 + i * 0.35) + 's');
    card.style.background = g.bg;
    card.style.borderColor = g.border;
    card.innerHTML = '<div class="card-pin"><div class="card-pin-clip"></div><div class="card-pin-needle"></div></div><div class="card-lines"></div><div class="card-row"><div class="card-text"><h3 class="card-title" style="color:' + g.titleColor + '">' + g.title + '</h3><p class="card-desc"><span class="card-desc-dot"></span>' + g.desc + '</p></div><div class="card-icon" style="background:' + g.iconBg + ';color:' + g.iconColor + '">' + svg(g.icon) + '</div></div><div class="card-footer"><span class="card-ready">مسار جاهز ' + svg('arrowleft') + '</span><span class="card-arrow">' + svg('arrowupright') + '</span></div>';
    cardsGrid.appendChild(card);
  });
  const catGrid = document.getElementById('catGrid');
  let selectedCategory = null;
  CATEGORIES.forEach(function (c) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-btn';
    btn.dataset.id = c.id;
    btn.innerHTML = '<div class="cat-icon">' + svg(c.icon) + '</div><div class="cat-text"><div class="cat-label">' + c.label + '</div><div class="cat-hint">' + c.hint + '</div></div><div class="cat-check">' + svg('check') + '</div>';
    btn.addEventListener('click', function () {
      selectedCategory = c.id;
      document.querySelectorAll('.cat-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      updateContinueButton();
    });
    catGrid.appendChild(btn);
  });
  const continueBtn = document.getElementById('continueBtn');
  function updateContinueButton() {
    if (selectedCategory) {
      continueBtn.disabled = false;
      continueBtn.classList.add('active');
    } else {
      continueBtn.disabled = true;
      continueBtn.classList.remove('active');
    }
  }
  const modalOverlay = document.getElementById('modalOverlay');
  const openModalBtn = document.getElementById('openModalBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  function openModal() { modalOverlay.classList.add('open'); document.body.classList.add('modal-open'); }
  function closeModal() { modalOverlay.classList.remove('open'); document.body.classList.remove('modal-open'); }
  openModalBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
  continueBtn.addEventListener('click', function () { if (!selectedCategory) return; closeModal(); });
})();
</script>
</body>
