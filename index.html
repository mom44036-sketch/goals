    { title: 'أريد اجتياز STEP', desc: 'مسار مخصص + متابعة يومية', icon: 'target', bg: '#F7F3FF', border: '#E7DCFA', iconBg: '#8B5CF6', iconColor: '#FFFFFF', titleColor: '#5B21B6', rotate: '1deg' },
    { title: 'أريد رفع درجة IELTS', desc: 'خطة احترافية + محاكاة اختبار', icon: 'award', bg: '#FFF4EC', border: '#FBDFC7', iconBg: '#FF8A3D', iconColor: '#FFFFFF', titleColor: '#B45309', rotate: '-1.2deg' },
    { title: 'أريد اجتياز القدرات', desc: 'شرح مبسط + تدريبات ذكية', icon: 'lightbulb', bg: '#FFFBEA', border: '#FBEEB8', iconBg: '#F2C94C', iconColor: '#5A4300', titleColor: '#8A6A00', rotate: '0.8deg' },
    { title: 'أريد الاستعداد للتحصيلي', desc: 'ملخصات مركزة + بنك أسئلة', icon: 'bookopen', bg: '#EFF7FF', border: '#D6EAFB', iconBg: '#3AA0F0', iconColor: '#FFFFFF', titleColor: '#1D6FB8', rotate: '-0.9deg' },
    { title: 'أريد تطوير الإنجليزية', desc: 'من الصفر حتى الاحتراف', icon: 'globe', bg: '#F0FBF4', border: '#D4F1DD', iconBg: '#34B364', iconColor: '#FFFFFF', titleColor: '#1E7A46', rotate: '1.1deg' },
    { title: 'أريد تطوير مهاراتي المهنية', desc: 'شهادات معتمدة + مشاريع عملية', icon: 'briefcase', bg: '#FFF1F7', border: '#FBD9E8', iconBg: '#E8479A', iconColor: '#FFFFFF', titleColor: '#B02472', rotate: '-1deg' }
  ];
  const CATEGORIES = [
    { id: 'eng', label: 'الدورات الهندسية', icon: 'compass', hint: 'AutoCAD, PMP, Revit' },
    { id: 'med', label: 'الدورات الطبية', icon: 'heartpulse', hint: 'BLS, مصطلحات، تمريض' },
    { id: 'kids', label: 'دورات الأطفال والناشئين', icon: 'smile', hint: 'برمجة، إنجليزي، قدرات' },
    { id: 'lang', label: 'دورات اللغة والاختبارات الدولية', icon: 'languages', hint: 'IELTS, STEP, TOEFL' },
    { id: 'qudrat', label: 'دورات القدرات والتحصيلي', icon: 'graduationcap', hint: 'لفظي، كمي، علمي' },
    { id: 'pro', label: 'دورات التطوير المهني', icon: 'trendingup', hint: 'إدارة، تسويق، حاسب' }
  ];

  const cardsGrid = document.getElementById('cardsGrid');
  GOALS.forEach((g,i)=>{
    const card=document.createElement('div');
    card.className='goal-card';
    card.style.setProperty('--rot', g.rotate);
    card.style.setProperty('--delay', (i*70)+'ms');
    card.style.setProperty('--float-delay', (0.5+i*0.35)+'s');
    card.style.background=g.bg; card.style.borderColor=g.border;
    card.innerHTML='<div class="card-pin"><div class="card-pin-clip"></div><div class="card-pin-needle"></div></div><div class="card-lines"></div><div class="card-row"><div class="card-text"><h3 class="card-title" style="color:'+g.titleColor+'">'+g.title+'</h3><p class="card-desc"><span class="card-desc-dot"></span>'+g.desc+'</p></div><div class="card-icon" style="background:'+g.iconBg+';color:'+g.iconColor+'">'+svg(g.icon)+'</div></div><div class="card-footer"><span class="card-ready">مسار جاهز '+svg('arrowleft')+'</span><span class="card-arrow">'+svg('arrowupright')+'</span></div>';
    cardsGrid.appendChild(card);
  });

  // CAROUSEL
  const dotsWrap=document.getElementById('carouselDots');
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  let currentIndex=0;
  function createDots(){ dotsWrap.innerHTML=''; GOALS.forEach((_,i)=>{ const d=document.createElement('span'); d.className='carousel-dot'+(i===0?' active':''); d.addEventListener('click',()=>scrollToIndex(i)); dotsWrap.appendChild(d); }); }
  function updateDots(idx){ currentIndex=idx; [...dotsWrap.children].forEach((dot,i)=>dot.classList.toggle('active', i===idx)); prevBtn.disabled=idx===0; nextBtn.disabled=idx===GOALS.length-1; }
  function scrollToIndex(idx){ if(idx<0||idx>=GOALS.length) return; cardsGrid.children[idx].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'}); updateDots(idx); }
  prevBtn.addEventListener('click',()=>scrollToIndex(currentIndex-1));
  nextBtn.addEventListener('click',()=>scrollToIndex(currentIndex+1));
  let scrollTimeout;
  cardsGrid.addEventListener('scroll', ()=>{ if(window.innerWidth>=1024) return; clearTimeout(scrollTimeout); scrollTimeout=setTimeout(()=>{ const gridRect=cardsGrid.getBoundingClientRect(); const center=gridRect.left+gridRect.width/2; let closest=0,minDist=Infinity; [...cardsGrid.children].forEach((card,i)=>{ const r=card.getBoundingClientRect(); const dist=Math.abs((r.left+r.width/2)-center); if(dist<minDist){ minDist=dist; closest=i; } }); updateDots(closest); },80); }, {passive:true});
  let isDown=false,startX,scrollLeft;
  cardsGrid.addEventListener('mousedown', e=>{ isDown=true; cardsGrid.classList.add('dragging'); startX=e.pageX-cardsGrid.offsetLeft; scrollLeft=cardsGrid.scrollLeft; });
  cardsGrid.addEventListener('mouseleave', ()=>{ isDown=false; cardsGrid.classList.remove('dragging'); });
  cardsGrid.addEventListener('mouseup', ()=>{ isDown=false; cardsGrid.classList.remove('dragging'); });
  cardsGrid.addEventListener('mousemove', e=>{ if(!isDown) return; e.preventDefault(); const x=e.pageX-cardsGrid.offsetLeft; const walk=(x-startX)*1.2; cardsGrid.scrollLeft=scrollLeft-walk; });
  createDots(); updateDots(0);

  // MODAL CATEGORIES
  const catGrid=document.getElementById('catGrid');
  let selectedCategory=null;
  CATEGORIES.forEach(c=>{
    const btn=document.createElement('button'); btn.type='button'; btn.className='cat-btn';
    btn.innerHTML='<div class="cat-icon">'+svg(c.icon)+'</div><div class="cat-text"><div class="cat-label">'+c.label+'</div><div class="cat-hint">'+c.hint+'</div></div><div class="cat-check">'+svg('check')+'</div>';
    btn.addEventListener('click', ()=>{ selectedCategory=c.id; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); updateContinue(); });
    catGrid.appendChild(btn);
  });
  const continueBtn=document.getElementById('continueBtn');
  function updateContinue(){ if(selectedCategory){ continueBtn.disabled=false; continueBtn.classList.add('active'); } else { continueBtn.disabled=true; continueBtn.classList.remove('active'); } }
  const modalOverlay=document.getElementById('modalOverlay');
  const openModalBtn=document.getElementById('openModalBtn');
  const closeModalBtn=document.getElementById('closeModalBtn');
  const modalBackdrop=document.getElementById('modalBackdrop');
  function openModal(){ modalOverlay.classList.add('open'); document.body.classList.add('modal-open'); }
  function closeModal(){ modalOverlay.classList.remove('open'); document.body.classList.remove('modal-open'); }
  openModalBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
  continueBtn.addEventListener('click', ()=>{ if(!selectedCategory) return; closeModal(); });
})();
</script>
</body>
</html>
