<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماذا تريد أن تحقق؟ | Ayed Academy - Improved</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #FFFFFF;
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 12px;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  body.modal-open { overflow: hidden; }

  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px) rotate(var(--rot)); }
    to   { opacity: 1; transform: translateY(0) rotate(var(--rot)); }
  }
  @keyframes sway {
    0%   { transform: rotate(var(--rot)); }
    25%  { transform: rotate(calc(var(--rot) + 1.6deg)); }
    50%  { transform: rotate(var(--rot)); }
    75%  { transform: rotate(calc(var(--rot) - 1.6deg)); }
    100% { transform: rotate(var(--rot)); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(16px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes checkPop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes pulseDot { 50% { opacity: .5; } }
  @keyframes dartFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
  }

  /* ===== hero section ===== */
  .hero-section {
    position: relative;
    width: 100%;
    max-width: 1240px;
    overflow: visible;
    background: #FFFFFF;
  }
  .hero-inner { position: relative; z-index: 10; padding: 32px 16px 32px; background: #FFFFFF; }
  @media (min-width: 768px) { .hero-inner { padding: 48px 24px 40px; } }
  @media (min-width: 1024px) { .hero-inner { padding-left: 64px; padding-right: 64px; } }

  .hero-header { text-align: center; max-width: 48rem; margin: 0 auto 24px; }
  @media (min-width: 768px) { .hero-header { margin-bottom: 32px; } }

  .hero-title {
    font-size: 28px; font-weight: 900; line-height: 1.15; letter-spacing: -0.025em; color: #1A1A1A; margin: 0;
  }
  @media (min-width: 768px) { .hero-title { font-size: 44px; } }

  .hero-subtitle {
    margin-top: 14px; font-size: 14px; color: #5A6D86; font-weight: 500; line-height: 1.625;
  }
  @media (min-width: 768px) { .hero-subtitle { font-size: 17px; } }

  /* ===== NEW: Carousel System ===== */
  .cards-carousel-viewport {
    position: relative;
    width: 100%;
    overflow: visible;
  }
  @media (max-width: 1023px) {
    .cards-carousel-viewport {
      overflow: hidden;
      margin: 0 -12px;
      padding: 12px 12px 8px;
      touch-action: pan-y;
    }
  }

  .cards-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 768px) and (max-width: 1023px) {
    .cards-grid {
      display: flex;
      gap: 16px;
      transition: transform .5s cubic-bezier(.16,1,.3,1);
      will-change: transform;
    }
  }
  @media (max-width: 767px) {
    .cards-grid {
      display: flex;
      gap: 14px;
      transition: transform .48s cubic-bezier(.16,1,.3,1);
      will-change: transform;
    }
  }
  @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 28px; } }

  .goal-card {
    position: relative;
    border-radius: 22px;
    border: 1px solid;
    padding: 22px;
    cursor: pointer;
    transform: rotate(var(--rot));
    transition: transform .42s cubic-bezier(.16,1,.3,1), box-shadow .42s cubic-bezier(.16,1,.3,1), border-color .3s;
    opacity: 0;
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards, sway 6.5s ease-in-out infinite;
    animation-delay: var(--delay), var(--float-delay);
    user-select: none;
  }
  @media (min-width: 768px) { .goal-card { padding: 26px; } }
  @media (max-width: 1023px) {
    .goal-card {
      min-width: calc(100% - 24px);
      max-width: calc(100% - 24px);
      flex-shrink: 0;
      transform: rotate(0deg) !important;
      animation: fadeUp .6s cubic-bezier(.16,1,.3,1) forwards !important;
      animation-delay: var(--delay) !important;
    }
    .goal-card:hover {
      transform: translateY(-4px) !important;
    }
  }
  @media (max-width: 767px) {
    .goal-card {
      min-width: calc(100% - 16px);
      max-width: calc(100% - 16px);
      padding: 20px;
    }
  }
  .goal-card:hover {
    z-index: 10;
    transform: rotate(0deg) translateY(-6px);
    border-color: rgba(255,181,38,.6);
    box-shadow: 0 20px 40px -12px rgba(13,47,86,.18), 0 8px 24px -8px rgba(13,47,86,.08);
    animation-play-state: paused;
  }

  .card-pin { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 20; }
  @media (max-width: 1023px) { .card-pin { display: none; } }
  .card-pin-clip {
    width: 42px; height: 14px; border-radius: 8px;
    background: linear-gradient(to bottom, #E8E9EB, #C9CDD2, #A8ADB4);
    box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.9);
    border: 1px solid #B8BEC6;
    position: relative; overflow: hidden;
  }
  .card-pin-clip::before {
    content: ""; position: absolute; inset-inline: 10%; top: 2px; height: 3px;
    background: rgba(255,255,255,.7); border-radius: 9999px; filter: blur(.5px);
  }
  .card-pin-needle { width: 3px; height: 6px; background: #B8BEC6; margin-top: -1px; }

  .card-lines {
    position: absolute; inset: 0; border-radius: inherit; opacity: .03; pointer-events: none;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 22px, #0D2F56 22px, #0D2F56 23px);
  }

  .card-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; position: relative; }
  .card-text { flex: 1; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 800; color: #1A1A1A; line-height: 1.375; margin: 0; }
  @media (min-width: 768px) { .card-title { font-size: 18px; } }
  .card-desc { margin-top: 8px; font-size: 13px; font-weight: 500; color: #6B7E94; display: flex; align-items: center; gap: 6px; }
  .card-desc-dot { width: 4px; height: 4px; border-radius: 9999px; background: #FFB526; flex-shrink: 0; }

  .card-icon {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(13,47,86,.12), inset 0 1px 0 rgba(255,255,255,.4);
    border: 1px solid rgba(255,255,255,.6);
    transition: transform .3s;
  }
  .goal-card:hover .card-icon { transform: scale(1.05); }
  .card-icon svg { width: 22px; height: 22px; stroke-width: 1.9; }

  .card-footer { margin-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: rgba(13,47,86,.7); }
  .goal-card:hover .card-footer { color: #0D2F56; }
  .card-ready {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px;
    background: rgba(255,255,255,.7); border: 1px solid rgba(13,47,86,.08); box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .card-ready svg { width: 12px; height: 12px; }
  .card-arrow {
    margin-right: auto; width: 24px; height: 24px; border-radius: 9999px;
    background: rgba(255,255,255,.7); border: 1px solid rgba(13,47,86,.08);
    display: flex; align-items: center; justify-content: center; transition: all .3s;
  }
  .goal-card:hover .card-arrow { background: #0D2F56; color: #fff; border-color: #0D2F56; }
  .card-arrow svg { width: 14px; height: 14px; }

  /* ===== Carousel Controls ===== */
  .carousel-controls {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 20px;
  }
  @media (max-width: 1023px) {
    .carousel-controls { display: flex; }
  }
  .carousel-btn {
    width: 42px; height: 42px; border-radius: 9999px;
    background: #FFFFFF;
    border: 1px solid #E6EEF7;
    color: #0D2F56;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(13,47,86,.06);
    transition: all .2s;
  }
  .carousel-btn:hover { background: #0D2F56; color: #fff; border-color: #0D2F56; transform: translateY(-1px); }
  .carousel-btn:disabled { opacity: .35; pointer-events: none; }
  .carousel-btn svg { width: 18px; height: 18px; }

  .carousel-dots {
    display: flex; align-items: center; gap: 6px;
    background: #F3F7FB; padding: 6px 12px; border-radius: 9999px; border: 1px solid #E6EEF7;
  }
  .carousel-dot {
    width: 6px; height: 6px; border-radius: 9999px; background: #C8D6E8; transition: all .3s;
  }
  .carousel-dot.active { width: 22px; background: #0D2F56; }
  .carousel-progress {
    font-size: 12px; font-weight: 700; color: #6B7E94; min-width: 38px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ===== "not sure" link ===== */
  .not-sure-wrap { margin-top: 28px; display: flex; justify-content: center; }
  @media (min-width: 768px) { .not-sure-wrap { margin-top: 36px; } }
  .not-sure-btn {
    background: none; border: none; padding: 0;
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 700; color: #0D2F56; transition: color .15s;
  }
  @media (min-width: 768px) { .not-sure-btn { font-size: 15px; } }
  .not-sure-btn:hover { color: #1A5399; }
  .not-sure-text-wrap { position: relative; }
  .not-sure-text { border-bottom: 1px dashed rgba(13,47,86,.3); padding-bottom: 2px; }
  .not-sure-underline {
    position: absolute; bottom: -3px; left: 0; width: 0; height: 2px; background: #FFB526; transition: width .5s;
  }
  .not-sure-btn:hover .not-sure-underline { width: 100%; }
  .not-sure-circle {
    width: 28px; height: 28px; border-radius: 9999px; background: #0D2F56; color: #fff;
    display: flex; align-items: center; justify-content: center; transition: all .3s;
  }
  .not-sure-btn:hover .not-sure-circle { background: #FFB526; color: #0D2F56; transform: rotate(-15deg); }
  .not-sure-circle svg { width: 16px; height: 16px; }

  .footer-divider { margin-top: 28px; padding-top: 18px; border-top: 1px solid #EEF2F7; display: flex; justify-content: center; }
  .footer-divider p {
    font-size: 11px; font-weight: 500; letter-spacing: .1em; color: #9AA9BC; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; margin: 0;
  }
  .footer-divider .line { width: 32px; height: 1px; background: #DCE6F2; }
  .credit { margin-top: 24px; font-size: 11px; color: #9AA9BC; font-weight: 500; }

  /* ===== modal - PROFESSIONAL REDESIGN ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    align-items: flex-end; justify-content: center; padding: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 768px) { .modal-overlay { align-items: center; padding: 24px; } }
  .modal-overlay.open { display: flex; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.44); backdrop-filter: blur(8px);
    animation: backdropIn .35s ease;
  }

  .modal-box {
    position: relative; width: 100%; background: #fff; overflow: hidden;
    border-radius: 28px 28px 0 0;
    box-shadow: 0 24px 80px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.2);
    display: flex; flex-direction: column;
    max-height: 92vh;
    max-height: 92dvh;
    animation: modalIn .5s cubic-bezier(.16,1,.3,1);
    margin-top: auto;
  }
  @media (min-width: 768px) {
    .modal-box { max-width: 680px; border-radius: 28px; max-height: 86vh; margin-top: 0; }
  }
  /* mobile full scroll: if content taller than viewport, whole box scrolls */
  @media (max-width: 767px) {
    .modal-box {
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .modal-body { overflow: visible; flex: none; }
    .modal-footer {
      position: sticky; bottom: 0; background: #fff; z-index: 3;
      box-shadow: 0 -8px 24px rgba(0,0,0,.04);
    }
  }

  /* ===== HEADER COMPACT ===== */
  .modal-header {
    position: relative;
    background: linear-gradient(120deg, #EAF6FF 0%, #D7EBFF 45%, #C2DDFF 100%);
    padding: 14px 18px 12px;
    overflow: hidden;
    flex-shrink: 0;
    border-radius: 28px 28px 0 0;
    border-bottom: 1px solid rgba(13,47,86,0.07);
  }
  @media (min-width: 768px) { .modal-header { padding: 18px 24px 16px; } }

  .modal-header-pattern {
    position: absolute; inset: -20px; opacity: 0.09; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230D2F56' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg transform='translate(40 40)'%3E%3Cpath d='M12 2 L14.8 8.8 L22 9.3 L16.5 14 L18 21 L12 17.5 L6 21 L7.5 14 L2 9.3 L9.2 8.8 Z'/%3E%3C/g%3E%3Cg transform='translate(150 35)'%3E%3Cpath d='M6 2 H18 V8 C18 12 15 15 12 15 C9 15 6 12 6 8 V2 Z'/%3E%3Cpath d='M6 4 H3 C2 4 1 5 1 7 C1 9 2 10 4 10'/%3E%3Cpath d='M18 4 H21 C22 4 23 5 23 7 C23 9 22 10 20 10'/%3E%3Cpath d='M12 15 V18'/%3E%3Cpath d='M8 18 H16'/%3E%3C/g%3E%3Cg transform='translate(240 38)'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='5'/%3E%3Ccircle cx='12' cy='12' r='1.5' fill='%230D2F56' stroke='none'/%3E%3C/g%3E%3Cg transform='translate(35 150)'%3E%3Cpath d='M12 4 L2 9 L12 14 L22 9 Z'/%3E%3Cpath d='M6 11 V15 C6 15 10 18 12 18 C14 18 18 15 18 15 V11'/%3E%3C/g%3E%3Cg transform='translate(145 148)'%3E%3Ccircle cx='12' cy='8' r='6'/%3E%3Cpath d='M9 14 L7 22 L12 19 L17 22 L15 14'/%3E%3C/g%3E%3Cg transform='translate(235 150)'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M8 12 L11 15 L16 9'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size: 300px 300px;
  }
  .modal-header-dots {
    position: absolute; inset: 0; opacity: 0.14;
    background-image: radial-gradient(rgba(13,47,86,0.22) 1.2px, transparent 1.2px);
    background-size: 20px 20px; pointer-events: none;
  }
  .modal-header-glow {
    position: absolute; top: -60px; right: -40px; width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%); pointer-events: none;
  }

  .modal-close {
    position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 9999px;
    background: rgba(13,47,86,0.06); border: 1px solid rgba(13,47,86,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #0D2F56; backdrop-filter: blur(8px); transition: all .15s; z-index: 5;
  }
  .modal-close:hover { background: rgba(13,47,86,0.1); }
  .modal-close svg { width: 14px; height: 14px; }

  .modal-header-content { position: relative; display: flex; align-items: center; gap: 14px; z-index: 2; }
  @media (min-width: 768px) { .modal-header-content { gap: 18px; } }

  .modal-header-dart {
    width: 54px; height: 54px; flex-shrink: 0;
    position: relative; display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 10px 16px rgba(13,47,86,0.18)) drop-shadow(0 4px 8px rgba(13,47,86,0.12));
    animation: dartFloat 5.2s cubic-bezier(0.37, 0, 0.63, 1) infinite;
  }
  @media (min-width: 768px) { .modal-header-dart { width: 68px; height: 68px; } }
  .modal-header-dart img { width: 100%; height: 100%; object-fit: contain; display: block; border: none; outline: none; background: transparent; }

  .modal-header-text { flex: 1; min-width: 0; }
  .modal-header-title { font-size: 15.5px; font-weight: 900; line-height: 1.3; margin: 0; color: #0D2F56; }
  @media (min-width: 768px) { .modal-header-title { font-size: 19px; } }
  .modal-header-subtitle { margin-top: 4px; font-size: 12.5px; font-weight: 500; color: #4A6B8A; line-height: 1.5; }
  @media (min-width: 768px) { .modal-header-subtitle { font-size: 13.5px; margin-top: 5px; } }

  .modal-body { position: relative; padding: 16px 14px; overflow-y: auto; flex: 1; background: #FCFDFF; }
  @media (min-width: 768px) { .modal-body { padding: 20px 20px; } }
  .cat-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 768px) { .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

  .cat-btn {
    text-align: right; width: 100%; border-radius: 14px; border: 1px solid #E6EEF7;
    background: #fff; padding: 14px; display: flex; align-items: center; gap: 12px;
    transition: all .2s; font-size: 13px; position: relative;
  }
  .cat-btn:hover { border-color: #C9D8EA; background: #F8FBFF; }
  .cat-btn.selected { background: #FFF8EB; border-color: #FFB526; border-width: 1.5px; box-shadow: 0 0 0 3px rgba(255,181,38,.15); }

  .cat-icon {
    width: 36px; height: 36px; border-radius: 10px; background: #EEF4FB; border: 1px solid #DDE8F5;
    color: #0D2F56; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s;
  }
  .cat-btn:hover .cat-icon, .cat-btn.selected .cat-icon { background: #0D2F56; color: #fff; border-color: #0D2F56; }
  .cat-icon svg { width: 18px; height: 18px; stroke-width: 1.9; }
  .cat-text { flex: 1; min-width: 0; }
  .cat-label { font-weight: 700; font-size: 13px; color: #1A1A1A; line-height: 1.25; }
  .cat-hint { font-size: 11px; color: #7A8BA3; margin-top: 2px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-check {
    width: 22px; height: 22px; border-radius: 9999px; border: 2px solid #D3DFEF; background: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s;
  }
  .cat-btn.selected .cat-check { background: #FFB526; border-color: #FFB526; color: #0D2F56; }
  .cat-check svg { width: 12px; height: 12px; display: none; animation: checkPop .35s cubic-bezier(.16,1,.3,1); }
  .cat-btn.selected .cat-check svg { display: block; }

  /* ===== FOOTER - Equal Height Buttons ===== */
  .modal-footer {
    position: relative; padding: 14px; background: #fff; border-top: 1px solid #EEF2F7;
    display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
  }
  @media (min-width: 768px) { .modal-footer { padding: 16px 20px; flex-direction: row; gap: 12px; } }

  .whatsapp-btn, .continue-btn {
    height: 50px;
    min-height: 50px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13.5px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0;
    transition: all .2s;
  }

  .whatsapp-btn {
    background: #EAF8EF; border: 1px solid #C8E9D0; color: #1B7A35;
    width: 100%;
  }
  @media (min-width: 768px) { .whatsapp-btn { width: auto; padding: 0 18px; } }
  .whatsapp-btn:hover { background: #DDF3E3; transform: translateY(-1px); }
  .whatsapp-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .continue-btn {
    position: relative; overflow: hidden; flex: 1;
    background: #F1F3F5; color: #ADB5BD; border: 1px solid #E9ECEF; cursor: not-allowed;
  }
  .continue-btn.active {
    background: #FFB526; color: #0D2F56; cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(255,181,38,.55);
    border-color: #FFB526;
  }
  .continue-btn.active:hover { background: #FFC44D; box-shadow: 0 10px 24px -6px rgba(255,181,38,.65); transform: translateY(-1px); }
  .continue-btn.active:active { transform: translateY(0); }
  .continue-shimmer {
    position: absolute; inset: 0; opacity: .3; pointer-events: none; display: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    animation: shimmer 2.2s infinite;
  }
  .continue-btn.active .continue-shimmer { display: block; }
  .continue-btn span.label { position: relative; display: flex; align-items: center; gap: 8px; }
  .continue-btn svg { width: 16px; height: 16px; }
</style>
</head>

<script>
(function () {
  const ICONS = {
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    award: '<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
    lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    bookopen: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
    compass: '<path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/>',
    heartpulse: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
    smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
    languages: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
    graduationcap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
    trendingup: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    arrowleft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    arrowupright: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    check: '<path d="M20 6 9 17l-5-5"/>'
  };
  function svg(iconKey) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[iconKey] + '</svg>';
  }
  const GOALS = [
    { title: 'أريد اجتياز STEP', desc: 'مسار مخصص + متابعة يومية', icon: 'target', bg: '#F7F3FF', border: '#E7DCFA', iconBg: '#8B5CF6', iconColor: '#FFFFFF', titleColor: '#5B21B6', rotate: '1deg' },
    { title: 'أريد رفع درجة IELTS', desc: 'خطة احترافية + محاكاة اختبار', icon: 'award', bg: '#FFF4EC', border: '#FBDFC7', iconBg: '#FF8A3D', iconColor: '#FFFFFF', titleColor: '#B45309', rotate: '-1.2deg' },
    { title: 'أريد اجتياز القدرات', desc: 'شرح مبسط + تدريبات ذكية', icon: 'lightbulb', bg: '#FFFBEA', border: '#FBEEB8', iconBg: '#F2C94C', iconColor: '#5A4300', titleColor: '#8A6A00', rotate: '0.8deg' },
    { title: 'أريد الاستعداد للتحصيلي', desc: 'ملخصات مركزة + بنك أسئلة', icon: 'bookopen', bg: '#EFF7FF', border: '#D6EAFB', iconBg: '#3AA0F0', iconColor: '#FFFFFF', titleColor: '#1D6FB8', rotate: '-0.9deg' },
    { title: 'أريد تطوير الإنجليزية', desc: 'من الصفر حتى الاحتراف', icon: 'globe', bg: '#F0FBF4', border: '#D4F1DD', iconBg: '#34B364', iconColor: '#FFFFFF', titleColor: '#1E7A46', rotate: '1.1deg' },
    { title: 'أريد تطوير مهاراتي المهنية', desc: 'شهادات معتمدة + مشاريع عملية', icon: 'briefcase', bg: '#FFF1F7', border: '#FBD9E8', iconBg: '#E8479A', iconColor: '#FFFFFF', titleColor: '#B02472', rotate: '-1deg' }
  ];
  const CATEGORIES = [
    { id: 'eng', label: 'الدورات الهندسية', icon: 'compass', hint: 'AutoCAD, PMP, Revit' },
    { id: 'med', label: 'الدورات الطبية', icon: 'heartpulse', hint: 'BLS, مصطلحات، تمريض' },
    { id: 'kids', label: 'دورات الأطفال والناشئين', icon: 'smile', hint: 'برمجة، إنجليزي، قدرات' },
    { id: 'lang', label: 'دورات اللغة والاختبارات الدولية', icon: 'languages', hint: 'IELTS, STEP, TOEFL' },
    { id: 'qudrat', label: 'دورات القدرات والتحصيلي', icon: 'graduationcap', hint: 'لفظي، كمي، علمي' },
    { id: 'pro', label: 'دورات التطوير المهني', icon: 'trendingup', hint: 'إدارة، تسويق، حاسب' }
  ];

  const cardsGrid = document.getElementById('cardsGrid');
  GOALS.forEach(function (g, i) {
    const card = document.createElement('div');
    card.className = 'goal-card';
    card.style.setProperty('--rot', g.rotate);
    card.style.setProperty('--delay', (i * 80) + 'ms');
    card.style.setProperty('--float-delay', (0.5 + i * 0.35) + 's');
    card.style.background = g.bg;
    card.style.borderColor = g.border;
    card.innerHTML = '<div class="card-pin"><div class="card-pin-clip"></div><div class="card-pin-needle"></div></div><div class="card-lines"></div><div class="card-row"><div class="card-text"><h3 class="card-title" style="color:' + g.titleColor + '">' + g.title + '</h3><p class="card-desc"><span class="card-desc-dot"></span>' + g.desc + '</p></div><div class="card-icon" style="background:' + g.iconBg + ';color:' + g.iconColor + '">' + svg(g.icon) + '</div></div><div class="card-footer"><span class="card-ready">مسار جاهز ' + svg('arrowleft') + '</span><span class="card-arrow">' + svg('arrowupright') + '</span></div>';
    cardsGrid.appendChild(card);
  });

  // ===== CAROUSEL LOGIC =====
  const viewport = document.getElementById('carouselViewport');
  const track = cardsGrid;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('carouselDots');
  const progressEl = document.getElementById('carouselProgress');
  const controls = document.getElementById('carouselControls');
  let currentIndex = 0;
  let isDragging = false;
  let startX = 0;
  let currentTranslate = 0;
  const isRTL = document.documentElement.dir === 'rtl' || document.body.dir === 'rtl';

  function isCarouselMode() { return window.innerWidth < 1024; }

  // create dots
  GOALS.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'carousel-dot' + (i===0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });

  function updateDots() {
    dotsWrap.querySelectorAll('.carousel-dot').forEach((d, i) => {
      d.classList.toggle('active', i === currentIndex);
    });
    if(progressEl) progressEl.textContent = (currentIndex+1) + ' / ' + GOALS.length;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === GOALS.length - 1;
  }

  function getCardGap() {
    return window.innerWidth < 768 ? 14 : 16;
  }

  function goTo(index) {
    if(!isCarouselMode()) return;
    currentIndex = Math.max(0, Math.min(index, GOALS.length - 1));
    const card = track.children[0];
    if(!card) return;
    const gap = getCardGap();
    const cardWidth = card.offsetWidth + gap;
    const offset = currentIndex * cardWidth;
    // RTL: positive offset to bring next card from left to view
    track.style.transform = isRTL ? 'translateX(' + offset + 'px)' : 'translateX(' + (-offset) + 'px)';
    updateDots();
  }

  function next() { goTo(currentIndex + 1); }
  function prev() { goTo(currentIndex - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  // Touch / swipe
  viewport.addEventListener('touchstart', (e) => {
    if(!isCarouselMode()) return;
    isDragging = true;
    startX = e.touches[0].clientX;
    track.style.transition = 'none';
  }, {passive: true});

  viewport.addEventListener('touchmove', (e) => {
    if(!isDragging || !isCarouselMode()) return;
    const x = e.touches[0].clientX;
    const diff = x - startX;
    // resistance if at edges
    if((currentIndex===0 && diff>0) || (currentIndex===GOALS.length-1 && diff<0)) return;
  }, {passive: true});

  viewport.addEventListener('touchend', (e) => {
    if(!isDragging || !isCarouselMode()) return;
    isDragging = false;
    track.style.transition = '';
    const endX = e.changedTouches[0].clientX;
    const diff = endX - startX;
    const threshold = 50;
    if(diff < -threshold) {
      // swipe left -> next in LTR, but in RTL swipe left should be prev? We keep natural: swipe left shows next
      if(isRTL) { if(diff < 0) prev(); } else { next(); }
      // Actually unify: left swipe = next visually regardless of dir
      // So for simplicity: diff < 0 => next
      if(diff < -threshold) { goTo(currentIndex + 1); }
    } else if(diff > threshold) {
      goTo(currentIndex - 1);
    }
  });

  // Mouse drag for desktop tablet
  let mouseDown = false;
  viewport.addEventListener('mousedown', (e) => { if(!isCarouselMode()) return; mouseDown = true; startX = e.clientX; track.style.transition='none'; });
  window.addEventListener('mouseup', (e) => {
    if(!mouseDown) return;
    mouseDown = false;
    track.style.transition='';
    const diff = e.clientX - startX;
    if(Math.abs(diff) > 50) {
      if(diff < 0) goTo(currentIndex + 1); else goTo(currentIndex - 1);
    }
  });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if(!isCarouselMode()) return;
    if(e.key === 'ArrowLeft') { isRTL ? next() : prev(); }
    if(e.key === 'ArrowRight') { isRTL ? prev() : next(); }
  });

  // Resize handler
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(!isCarouselMode()) {
        track.style.transform = '';
        controls.style.display = 'none';
      } else {
        controls.style.display = 'flex';
        goTo(currentIndex);
      }
    }, 120);
  });

  // init
  if(isCarouselMode()) { goTo(0); } else { controls.style.display = 'none'; }

  // ===== CATEGORIES =====
  const catGrid = document.getElementById('catGrid');
  let selectedCategory = null;
  CATEGORIES.forEach(function (c) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-btn';
    btn.dataset.id = c.id;
    btn.innerHTML = '<div class="cat-icon">' + svg(c.icon) + '</div><div class="cat-text"><div class="cat-label">' + c.label + '</div><div class="cat-hint">' + c.hint + '</div></div><div class="cat-check">' + svg('check') + '</div>';
    btn.addEventListener('click', function () {
      selectedCategory = c.id;
      document.querySelectorAll('.cat-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      updateContinueButton();
    });
    catGrid.appendChild(btn);
  });

  const continueBtn = document.getElementById('continueBtn');
  function updateContinueButton() {
    if (selectedCategory) {
      continueBtn.disabled = false;
      continueBtn.classList.add('active');
    } else {
      continueBtn.disabled = true;
      continueBtn.classList.remove('active');
    }
  }

  const modalOverlay = document.getElementById('modalOverlay');
  const openModalBtn = document.getElementById('openModalBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  function openModal() { modalOverlay.classList.add('open'); document.body.classList.add('modal-open'); }
  function closeModal() { modalOverlay.classList.remove('open'); document.body.classList.remove('modal-open'); }
  openModalBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal(); });
  continueBtn.addEventListener('click', function () { if (!selectedCategory) return; closeModal(); });
})();
</script>
